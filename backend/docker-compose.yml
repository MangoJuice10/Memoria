services:
  dev-db:
    image: postgres:18
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: memoria
    networks:
      - memoria
    volumes:
      - dev_postgres_data:/var/lib/postgresql

  test-db:
    image: postgres:18
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: memoria
    networks:
      - memoria
    volumes:
      - test_postgres_data:/var/lib/postgresql

  dev-vector-db:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - memoria

  test-vector-db:
    image: qdrant/qdrant:latest
    ports:
      - "6334:6333"
    volumes:
      - test_qdrant_data:/qdrant/storage
    networks:
      - memoria

  dev-minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - dev_minio_data:/data
    networks:
      - memoria

  test-minio:
    image: minio/minio:latest
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - test_minio_data:/data
    networks:
      - memoria

networks:
  memoria:

volumes:
  dev_postgres_data:
  test_postgres_data:
  qdrant_data:
  test_qdrant_data:
  dev_minio_data:
  test_minio_data: