services:
  dev-db:
    image: postgres:18
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: memoria
    networks:
      - memoria
    volumes:
      - dev_postgres_data:/var/lib/postgresql

  test-db:
    image: postgres:18
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: memoria
    networks:
      - memoria
    volumes:
      - test_postgres_data:/var/lib/postgresql

  vector-db:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - memoria

networks:
  memoria:

volumes:
  dev_postgres_data:
  test_postgres_data:
  qdrant_data:
